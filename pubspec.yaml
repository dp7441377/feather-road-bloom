name: feather_road_bloom
description: "FeatherRoadBloom — generated by Android App Factory"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon_1024.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  # Listed file by file on purpose: a bare "- assets/" would also bundle the
  # ~14MB icon_1024.png source, which is only ever used by the launcher-icon
  # generator and is never loaded at runtime.
  assets:
    - assets/bg_loader.png
    - assets/bg_menu.png
    - assets/bg_map.png
    - assets/bg_game.png
    - assets/bg_result.png
    - assets/sprite_bird_hero.png
    - assets/sprite_feather.png
    - assets/sprite_nest.png
    - assets/sprite_garden.png
    - assets/sprite_star.png
    - assets/button_cta.png
